<!DOCTYPE html>
<html lang="pl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Pet Collection</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;500;600&family=Unbounded:wght@600;700&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #f6e9f7; --surface: #ffffff; --tint: #ffe0ef; --text: #231447; --muted: #7a6a9c;
    --edge: #231447; --shadow: #231447; --shadow-done: #ff4f9a; --accent: #ff4f9a;
    --accent-ink: #ffffff; --track: #e6d2ee;
    color-scheme: light; box-sizing: border-box;
    padding-top: env(safe-area-inset-top, 0px); padding-bottom: env(safe-area-inset-bottom, 0px);
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --bg: #150d33; --surface: #221752; --tint: #3b1e60; --text: #f5ecff; --muted: #a698cf;
      --edge: #6a54c4; --shadow: #0a0620; --shadow-done: #ff6fb0; --accent: #ff6fb0;
      --accent-ink: #2a0a1e; --track: #2e2166; color-scheme: dark;
    }
  }
  :root[data-theme="dark"] {
    --bg: #150d33; --surface: #221752; --tint: #3b1e60; --text: #f5ecff; --muted: #a698cf;
    --edge: #6a54c4; --shadow: #0a0620; --shadow-done: #ff6fb0; --accent: #ff6fb0;
    --accent-ink: #2a0a1e; --track: #2e2166; color-scheme: dark;
  }
  body[data-tab="mythic"] { --accent: #1fb9a8; --accent-ink: #06302b; --tint: #d3f5ef; --shadow-done: #1fb9a8; }
  body[data-tab="shiny"] { --accent: #ffb81f; --accent-ink: #3a2500; --tint: #fff0c4; --shadow-done: #f0a000; }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) body[data-tab="mythic"] { --accent: #4fe0cc; --tint: #124049; --shadow-done: #4fe0cc; }
    :root:not([data-theme="light"]) body[data-tab="shiny"] { --accent: #ffc94d; --tint: #4a3612; --shadow-done: #ffc94d; }
  }
  :root[data-theme="dark"] body[data-tab="mythic"] { --accent: #4fe0cc; --tint: #124049; --shadow-done: #4fe0cc; }
  :root[data-theme="dark"] body[data-tab="shiny"] { --accent: #ffc94d; --tint: #4a3612; --shadow-done: #ffc94d; }

  html { scroll-padding-top: env(safe-area-inset-top, 0px); }
  * { box-sizing: border-box; }
  body {
    margin: 0; background: var(--bg); color: var(--text);
    font-family: "Outfit", system-ui, -apple-system, "Segoe UI", Roboto, Arial, sans-serif; line-height: 1.4;
  }
  main { max-width: 540px; margin: 0 auto; padding: 24px 18px 56px; }

  .tabs { display: flex; flex-wrap: wrap; gap: 8px; margin-bottom: 26px; }
  button.tab {
    padding: 8px 14px; font-size: .92rem; font-weight: 500; color: var(--muted);
    background: transparent; border: 2px solid var(--line, var(--track)); border-radius: 14px 6px 14px 6px; box-shadow: none;
  }
  button.tab[aria-selected="true"] {
    color: var(--accent-ink); background: var(--accent); border-color: var(--edge);
    box-shadow: 3px 3px 0 var(--shadow); font-weight: 600;
  }

  header { display: flex; align-items: center; justify-content: space-between; gap: 16px; margin-bottom: 28px; }
  h1 {
    margin: 0; font-family: "Unbounded", "Arial Black", system-ui, sans-serif;
    font-weight: 700; font-size: clamp(1.6rem, 7.5vw, 2.3rem); line-height: 1.05; letter-spacing: -0.02em;
  }
  .ind { flex: 0 0 auto; }
  .num { font-family: "Unbounded", "Arial Black", system-ui, sans-serif; font-weight: 700; line-height: 1.1; }
  .lbl { color: var(--muted); font-size: .78rem; font-weight: 500; }

  .ring { position: relative; width: 104px; height: 104px; }
  .ring svg { width: 100%; height: 100%; transform: rotate(-90deg); display: block; }
  .ring .t { fill: none; stroke: var(--track); stroke-width: 11; }
  .ring .f { fill: none; stroke: var(--accent); stroke-width: 11; stroke-linecap: round; stroke-dasharray: 289; stroke-dashoffset: 289; transition: stroke-dashoffset .35s ease; }
  .ring .in { position: absolute; inset: 0; display: grid; place-content: center; text-align: center; }
  .ring .num { font-size: 1.15rem; }

  .dots { display: grid; grid-template-columns: repeat(5, 18px); gap: 7px; justify-content: end; }
  .dots i { width: 18px; height: 18px; border-radius: 50%; background: var(--surface); border: 2px solid var(--edge); transition: background .2s ease, border-color .2s ease; }
  .dots i.on { background: var(--accent); border-color: var(--accent); }
  .stars { display: flex; gap: 5px; justify-content: flex-end; }
  .stars i {
    width: 26px; height: 26px; background: var(--track); transition: background .2s ease;
    clip-path: polygon(50% 0%, 61% 39%, 100% 50%, 61% 61%, 50% 100%, 39% 61%, 0% 50%, 39% 39%);
  }
  .stars i.on { background: var(--accent); }
  li { position: relative; }
  .tank { position: relative; width: 112px; height: 112px; margin-left: auto; border-radius: 50%; border: 2px solid var(--edge); background: var(--surface); overflow: hidden; box-shadow: 4px 4px 0 var(--shadow); }
  .tank::after { content: ""; position: absolute; top: 12px; left: 18px; width: 26px; height: 13px; border-radius: 50%; background: #fff; opacity: .6; transform: rotate(-35deg); z-index: 2; }
  .liq { position: absolute; left: 0; right: 0; bottom: 0; height: var(--h, 0%); background: var(--accent); transition: height .9s cubic-bezier(.3, 1.25, .4, 1); }
  .liq i { position: absolute; left: 0; top: -9px; width: 200%; height: 18px; border-radius: 50%; background: var(--accent); animation: drift 3.2s ease-in-out infinite alternate; }
  .liq i.w2 { top: -13px; opacity: .5; animation-duration: 4.8s; animation-direction: alternate-reverse; }
  .tank.empty .liq i { display: none; }
  .bbs { position: absolute; inset: 0; overflow: hidden; }
  .bbs b { position: absolute; bottom: -10px; border-radius: 50%; background: rgba(255, 255, 255, .6); animation: up 3.6s ease-in infinite; }
  @keyframes drift { from { transform: translateX(-25%); } to { transform: translateX(0); } }
  @keyframes up { 0% { transform: translateY(0); opacity: 0; } 15% { opacity: 1; } 100% { transform: translateY(-90px); opacity: 0; } }
  .gemwrap { position: relative; width: 112px; margin-left: auto; }
  .gem { display: block; width: 112px; height: auto; overflow: visible; }
  .gem .gbg { fill: var(--track); }
  .gem .gfill { transform: translateY(calc((1 - var(--p, 0)) * 96px)); transition: transform .9s cubic-bezier(.3, 1.2, .4, 1); }
  .gem .gfill rect { fill: var(--accent); }
  .gem .glint { fill: #fff; opacity: .55; transform: translateX(-40px) skewX(-20deg); animation: glint 3.4s ease-in-out infinite; }
  .gem .gl { fill: none; stroke: #fff; stroke-opacity: .55; stroke-width: 1.5; }
  .gem .go { fill: none; stroke: var(--edge); stroke-width: 3; stroke-linejoin: round; }
  @keyframes glint { 0%, 55% { transform: translateX(-40px) skewX(-20deg); } 100% { transform: translateX(150px) skewX(-20deg); } }
  .sp { position: absolute; width: 14px; height: 14px; background: var(--accent); clip-path: polygon(50% 0%, 61% 39%, 100% 50%, 61% 61%, 50% 100%, 39% 61%, 0% 50%, 39% 39%); animation: tw 2.4s ease-in-out infinite; }
  .sp.a { top: -4px; left: 6px; }
  .sp.b { top: 18px; right: -6px; width: 10px; height: 10px; animation-delay: .8s; }
  .sp.c { bottom: 22px; left: -8px; width: 12px; height: 12px; animation-delay: 1.6s; }
  @keyframes tw { 0%, 100% { transform: scale(.3); opacity: .2; } 50% { transform: scale(1); opacity: 1; } }
  .pt { position: absolute; left: 30px; top: 50%; width: 10px; height: 10px; margin: -5px 0 0 -5px; pointer-events: none; z-index: 3; animation: burst .75s ease-out forwards; }
  .pt.pb { border-radius: 50%; border: 2px solid var(--accent); background: rgba(255, 255, 255, .35); }
  .pt.ps { width: 16px; height: 16px; margin: -8px 0 0 -8px; background: var(--accent); clip-path: polygon(50% 0%, 61% 39%, 100% 50%, 61% 61%, 50% 100%, 39% 61%, 0% 50%, 39% 39%); }
  @keyframes burst { from { transform: translate(0, 0) scale(.3); opacity: 1; } to { transform: translate(var(--dx), var(--dy)) scale(1.1); opacity: 0; } }
  label::after { content: ""; position: absolute; top: 0; bottom: 0; left: -40%; width: 28%; opacity: 0; pointer-events: none; background: linear-gradient(100deg, transparent, rgba(255, 255, 255, .6), transparent); }
  li.fresh label::after { animation: sweep .9s ease; }
  @keyframes sweep { from { left: -40%; opacity: 1; } to { left: 130%; opacity: 1; } }
  .bub.st { border: none; background: var(--accent); clip-path: polygon(50% 0%, 61% 39%, 100% 50%, 61% 61%, 50% 100%, 39% 61%, 0% 50%, 39% 39%); }
  .cap { margin-top: 12px; text-align: right; }
  .cap .pct { font-family: "Unbounded", "Arial Black", system-ui, sans-serif; font-weight: 700; font-size: 1.4rem; line-height: 1.1; }
  .cap .num { font-size: 1.05rem; }

  ul { list-style: none; margin: 0; padding: 0; display: grid; gap: 12px; }
  label {
    display: flex; align-items: center; gap: 14px; cursor: pointer;
    position: relative; overflow: hidden;
    padding: 12px 18px 12px 12px; font-size: 1.06rem; font-weight: 500;
    background: var(--surface); border: 2px solid var(--edge);
    border-radius: 24px 8px 24px 8px; box-shadow: 4px 4px 0 var(--shadow);
    -webkit-tap-highlight-color: transparent;
    transition: background .15s ease, box-shadow .15s ease, transform .1s ease;
  }
  label:active { transform: translate(2px, 2px); box-shadow: 2px 2px 0 var(--shadow); }
  li.done label { background: var(--tint); box-shadow: 4px 4px 0 var(--shadow-done); }
  li.done .name { color: var(--muted); text-decoration: line-through; text-decoration-color: var(--accent); text-decoration-thickness: 2px; }

  input[type="checkbox"] {
    appearance: none; -webkit-appearance: none; position: relative;
    flex: 0 0 auto; width: 32px; height: 32px; margin: 0; cursor: pointer;
    border: 2px solid var(--edge); border-radius: 50%; background: var(--surface);
    display: grid; place-content: center;
  }
  input[type="checkbox"]::before {
    content: ""; position: absolute; top: 5px; left: 6px; width: 9px; height: 5px;
    border-radius: 50%; background: var(--edge); opacity: .22; transform: rotate(-35deg);
  }
  input[type="checkbox"]::after {
    content: ""; width: 13px; height: 7px;
    border-left: 3px solid var(--accent-ink); border-bottom: 3px solid var(--accent-ink);
    transform: rotate(-45deg) translate(1px, -1px) scale(0); transition: transform .14s ease;
  }
  input[type="checkbox"]:checked { background: var(--accent); border-color: var(--accent); }
  input[type="checkbox"]:checked::before { background: #fff; opacity: .55; }
  input[type="checkbox"]:checked::after { transform: rotate(-45deg) translate(1px, -1px) scale(1); }
  input[type="checkbox"].pop { animation: pop .3s ease; }
  input[type="checkbox"]:focus-visible, button:focus-visible { outline: 3px solid var(--accent); outline-offset: 3px; }
  @keyframes pop { 0% { transform: scale(.8); } 55% { transform: scale(1.2); } 100% { transform: scale(1); } }

  .actions { margin-top: 28px; display: flex; justify-content: flex-end; }
  button {
    font: inherit; font-weight: 600; color: var(--text); cursor: pointer;
    background: var(--surface); border: 2px solid var(--edge); border-radius: 14px 6px 14px 6px;
    padding: 10px 18px; box-shadow: 3px 3px 0 var(--shadow);
  }
  button:active { transform: translate(2px, 2px); box-shadow: 1px 1px 0 var(--shadow); }

  .win {
    position: fixed; inset: 0; display: none; place-items: center; overflow: hidden; z-index: 50;
    padding: calc(24px + env(safe-area-inset-top, 0px)) 24px calc(24px + env(safe-area-inset-bottom, 0px));
    background: rgba(21, 13, 51, .6);
  }
  .win.show { display: grid; }
  .win-card {
    position: relative; z-index: 2; max-width: 360px; text-align: center;
    padding: 30px 26px 24px; background: var(--tint); border: 2px solid var(--edge);
    border-radius: 32px 10px 32px 10px; box-shadow: 6px 6px 0 var(--shadow-done);
    animation: card-in .5s cubic-bezier(.2, 1.3, .4, 1);
  }
  .win-badge { position: relative; width: 66px; height: 66px; margin: 0 auto 16px; border-radius: 50%; background: var(--accent); border: 2px solid var(--edge); display: grid; place-content: center; }
  .win-badge::before { content: ""; position: absolute; top: 9px; left: 12px; width: 16px; height: 9px; border-radius: 50%; background: #fff; opacity: .55; transform: rotate(-35deg); }
  .win-badge::after { content: ""; width: 26px; height: 14px; border-left: 5px solid var(--accent-ink); border-bottom: 5px solid var(--accent-ink); transform: rotate(-45deg) translate(2px, -2px); }
  .win-card h2 { margin: 0 0 10px; font-family: "Unbounded", "Arial Black", system-ui, sans-serif; font-weight: 700; font-size: clamp(1.35rem, 6.5vw, 1.75rem); line-height: 1.15; letter-spacing: -0.01em; }
  .win-card p { margin: 0 0 22px; color: var(--muted); }
  .bub { position: absolute; z-index: 1; bottom: -80px; border-radius: 50%; pointer-events: none; border: 2px solid var(--accent); background: rgba(255, 255, 255, .22); animation: rise linear forwards; }
  @keyframes rise { from { transform: translateY(0); opacity: .95; } to { transform: translateY(-125vh); opacity: 0; } }
  @keyframes card-in { from { transform: scale(.6) rotate(-4deg); opacity: 0; } to { transform: none; opacity: 1; } }

  @media (prefers-reduced-motion: reduce) {
    * { transition: none !important; animation: none !important; }
  }
</style>
</head>
<body data-tab="pets">
<main>
  <div class="tabs" id="tabs" role="tablist"></div>

  <header>
    <h1 id="title">Pet Collection</h1>
    <div class="ind" id="ind" aria-live="polite"></div>
  </header>

  <ul id="list"></ul>

  <div class="actions"><button id="reset" type="button">Odznacz wszystkie</button></div>
</main>

<div class="win" id="win" role="dialog" aria-modal="true" aria-labelledby="winTitle">
  <div class="win-card">
    <div class="win-badge" aria-hidden="true"></div>
    <h2 id="winTitle">Lista ukończona,<br>gratulacje!</h2>
    <p>Masz wszystkie pety z listy.</p>
    <button id="winClose" type="button">Zamknij</button>
  </div>
</div>

<script>
(function () {
  var TABS = [
    { id: "pets", title: "Pet Collection", ind: "ring", items: [
      "The Leviathan", "Silly Leviathan", "Leviathan Plushie", "King Leviathan",
      "Shadow Leviathan", "Mecha Leviathan", "Beach Leviathan", "Peppermint Leviathan",
      "Dice Leviathan", "Super Leviathan", "Rainbow Leviathan", "Classic Leviathan",
      "Leviathan Tophat", "Leviathan Golfball", "Void Shadow Leviathan",
      "Ancient Shadow Leviathan", "Man Face Leviathan", "Bubbleviathan", "Cheshire Cat",
      "Eversource", "Jackpot Gem", "Godly Gem" ] },
    { id: "mythic", title: "Mythic Secrets", ind: "dots", items: [
      "Mythic Wolflord", "Mythic Inferno Gem", "Mythic White Swan", "Mythic Dragonfruit",
      "Mythic Ultrapergine", "Mythic Lotus Gem", "Mythic Ultimate Clover",
      "Mythic Angelic Spirit", "Mythic Shinigami", "Mythic Void Crystal Dragon",
      "Mythic Radiant Crystal Dragon", "Mythic Starcaster", "Mythic Liberty" ] },
    { id: "shiny", title: "Shiny Mythic Secrets", ind: "stars", items: [
      "Shiny Mythic Shinigami", "Shiny Mythic Illumination", "Shiny Mythic Dark Gryphon",
      "Shiny Mythic Earth Champion", "Shiny Mythic Fire Champion",
      "Shiny Mythic Sky Champion", "Shiny Mythic Dark Champion" ] }
  ];
  var KEY = "pety-lista-v1", TKEY = "pety-tab-v1", C = 289;
  var checked = {}, cur = 0;

  function load() {
    try {
      var raw = localStorage.getItem(KEY);
      if (raw) { checked = JSON.parse(raw) || {}; }
      var t = parseInt(localStorage.getItem(TKEY), 10);
      if (t >= 0 && t < TABS.length) { cur = t; }
    } catch (e) { checked = {}; }
    if (checked["Ultra Pergine/Mythic Ultrapergine"]) {
      checked["Mythic Ultrapergine"] = true;
      delete checked["Ultra Pergine/Mythic Ultrapergine"];
    }
  }
  function save() { try { localStorage.setItem(KEY, JSON.stringify(checked)); } catch (e) {} }
  function saveTab() { try { localStorage.setItem(TKEY, String(cur)); } catch (e) {} }

  var tabsEl = document.getElementById("tabs");
  var titleEl = document.getElementById("title");
  var ind = document.getElementById("ind");
  var list = document.getElementById("list");

  function countOf(tab) {
    var n = 0;
    tab.items.forEach(function (p) { if (checked[p]) { n++; } });
    return n;
  }

  function buildInd(tab) {
    var cap = '<div class="cap"><span class="num"></span> <span class="lbl"></span></div>';
    var cells = tab.items.map(function () { return "<i></i>"; }).join("");
    if (tab.ind === "ring") {
      ind.innerHTML = '<div class="ring"><svg viewBox="0 0 104 104" aria-hidden="true"><circle class="t" cx="52" cy="52" r="46"></circle><circle class="f" cx="52" cy="52" r="46"></circle></svg><div class="in"><span class="num"></span><span class="lbl"></span></div></div>';
    } else if (tab.ind === "dots") {
      ind.innerHTML = '<div class="tank empty" aria-hidden="true"><div class="liq"><i></i><i class="w2"></i><div class="bbs"><b style="left:22%;width:7px;height:7px;animation-delay:0s"></b><b style="left:48%;width:10px;height:10px;animation-delay:1.1s"></b><b style="left:70%;width:6px;height:6px;animation-delay:2.2s"></b><b style="left:35%;width:5px;height:5px;animation-delay:2.8s"></b></div></div></div><div class="cap"><div class="pct"></div><div><span class="num"></span> <span class="lbl"></span></div></div>';
    } else {
      ind.innerHTML = '<div class="gemwrap" aria-hidden="true"><svg class="gem" viewBox="0 0 104 96"><defs><clipPath id="gc"><path d="M26 6H78L100 36L52 90L4 36Z"></path></clipPath></defs><g clip-path="url(#gc)"><rect class="gbg" width="104" height="96"></rect><g class="gfill"><rect width="104" height="96"></rect></g><rect class="glint" x="0" y="-10" width="18" height="120"></rect></g><path class="gl" d="M4 36H100M26 6L40 36L52 90L64 36L78 6M40 36L52 6L64 36"></path><path class="go" d="M26 6H78L100 36L52 90L4 36Z"></path></svg><i class="sp a"></i><i class="sp b"></i><i class="sp c"></i></div><div class="cap"><div class="pct"></div><div><span class="num"></span> <span class="lbl"></span></div></div>';
    }
  }

  function updateInd() {
    var tab = TABS[cur], n = countOf(tab), total = tab.items.length;
    ind.querySelector(".num").textContent = n + "/" + total;
    ind.querySelector(".lbl").textContent = n === total ? "komplet" : "zebrane";
    if (tab.ind === "ring") {
      ind.querySelector(".f").style.strokeDashoffset = String(C * (1 - n / total));
    } else {
      var p = n / total;
      var liq = ind.querySelector(".liq"), tank = ind.querySelector(".tank"), gf = ind.querySelector(".gfill"), pe = ind.querySelector(".pct");
      if (liq) { liq.style.setProperty("--h", (p * 100) + "%"); tank.className = n === 0 ? "tank empty" : "tank"; }
      if (gf) { gf.style.setProperty("--p", String(p)); }
      if (pe) { tween(pe, Math.round(p * 100)); }
      var els = [];
      for (var i = 0; i < els.length; i++) { els[i].className = ""; }
    }
  }

  function renderList() {
    list.innerHTML = "";
    TABS[cur].items.forEach(function (p) {
      var li = document.createElement("li");
      var lab = document.createElement("label");
      var cb = document.createElement("input");
      cb.type = "checkbox";
      cb.checked = !!checked[p];
      var sp = document.createElement("span");
      sp.className = "name";
      sp.textContent = p;
      li.className = cb.checked ? "done" : "";
      cb.addEventListener("change", function () {
        if (cb.checked) { checked[p] = true; } else { delete checked[p]; }
        li.className = cb.checked ? "done" : "";
        cb.classList.remove("pop");
        void cb.offsetWidth;
        cb.classList.add("pop");
        if (cb.checked && TABS[cur].id !== "pets") {
          burst(li, TABS[cur].id);
          li.classList.remove("fresh");
          void li.offsetWidth;
          li.classList.add("fresh");
        }
        save();
        updateInd();
        var tab = TABS[cur];
        if (cb.checked && countOf(tab) === tab.items.length) { showWin(); }
      });
      lab.appendChild(cb);
      lab.appendChild(sp);
      li.appendChild(lab);
      list.appendChild(li);
    });
  }

  function show() {
    var tab = TABS[cur];
    document.body.setAttribute("data-tab", tab.id);
    titleEl.textContent = tab.title;
    var btns = tabsEl.querySelectorAll("button");
    for (var i = 0; i < btns.length; i++) {
      btns[i].setAttribute("aria-selected", i === cur ? "true" : "false");
    }
    buildInd(tab);
    renderList();
    updateInd();
  }

  TABS.forEach(function (t, i) {
    var b = document.createElement("button");
    b.type = "button";
    b.className = "tab";
    b.setAttribute("role", "tab");
    b.textContent = t.title;
    b.addEventListener("click", function () { cur = i; saveTab(); show(); });
    tabsEl.appendChild(b);
  });

  document.getElementById("reset").addEventListener("click", function () {
    TABS[cur].items.forEach(function (p) { delete checked[p]; });
    save();
    show();
  });

  var win = document.getElementById("win");
  var closeBtn = document.getElementById("winClose");
  var calm = window.matchMedia && window.matchMedia("(prefers-reduced-motion: reduce)").matches;

  function bubbles() {
    if (calm) { return; }
    for (var i = 0; i < 28; i++) {
      var b = document.createElement("i");
      b.className = "bub" + (TABS[cur].id === "shiny" ? " st" : "");
      var s = 14 + Math.random() * 40;
      b.style.width = s + "px";
      b.style.height = s + "px";
      b.style.left = (Math.random() * 100) + "%";
      b.style.animationDuration = (2.6 + Math.random() * 2.8) + "s";
      b.style.animationDelay = (Math.random() * 1.3) + "s";
      win.appendChild(b);
    }
  }
  function burst(li, kind) {
    if (calm) { return; }
    for (var i = 0; i < 9; i++) {
      var d = document.createElement("i");
      d.className = "pt " + (kind === "shiny" ? "ps" : "pb");
      var a = (Math.PI * 2 * i) / 9 + Math.random() * 0.5;
      var r = 38 + Math.random() * 34;
      d.style.setProperty("--dx", (Math.cos(a) * r) + "px");
      d.style.setProperty("--dy", (Math.sin(a) * r) + "px");
      li.appendChild(d);
      (function (el) { setTimeout(function () { el.remove(); }, 800); })(d);
    }
  }
  function tween(el, to) {
    var from = el._v || 0;
    el._v = to;
    if (calm || from === to) { el.textContent = to + "%"; return; }
    var t0 = null;
    function step(t) {
      if (t0 === null) { t0 = t; }
      var k = Math.min((t - t0) / 700, 1);
      el.textContent = Math.round(from + (to - from) * k) + "%";
      if (k < 1) { requestAnimationFrame(step); }
    }
    requestAnimationFrame(step);
  }
  function showWin() { win.classList.add("show"); bubbles(); closeBtn.focus(); }
  function hideWin() {
    win.classList.remove("show");
    Array.prototype.slice.call(win.querySelectorAll(".bub")).forEach(function (b) { b.remove(); });
  }
  closeBtn.addEventListener("click", hideWin);
  win.addEventListener("click", function (e) { if (e.target === win) { hideWin(); } });
  document.addEventListener("keydown", function (e) { if (e.key === "Escape") { hideWin(); } });

  load();
  show();
})();
</script>
</body>
</html>
